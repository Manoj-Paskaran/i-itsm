[project]
name = "itsm-ml"
version = "0.1.0"
description = "I-ITSM intelligence service: classification, SLA risk and AI contract scaffold"
readme = "README.md"
authors = [
    { name = "Aditya  Jain", email = "adiiixya@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "google-adk>=2.13.0",
    "google-genai>=2.34.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
itsm-ml = "itsm_ml.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261030",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["slow: model/download integration checks; opt in with --run-slow"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "pandas.*"]
ignore_missing_imports = true
